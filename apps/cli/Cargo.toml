[package]
name = "perkolator-cli"
description = "Headless Perkolator CLI: search, inspect, validate, plan deployments."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "perkolator_cli"
path = "src/lib.rs"

[[bin]]
name = "perk"
path = "src/main.rs"

[dependencies]
perkolator-core.workspace = true
perkolator-registry.workspace = true
perkolator-targets.workspace = true
perkolator-deployment.workspace = true
perkolator-search.workspace = true
perkolator-preview.workspace = true
perkolator-actions.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
